# Minimal `opencode github run` (as used by ask-bonk / sst opencode GitHub agent), trigger '/oc'.
name: "Repro: opencode github run"
on:
  issue_comment:
    types: [created]
jobs:
  oc:
    if: contains(github.event.comment.body, '/oc') && github.event.comment.user.login == 'hicay'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - run: npm i -g opencode-ai@1.19.6 && opencode --version
      - name: Run opencode
        run: opencode github run
        env:
          MODEL: anthropic/claude-sonnet-4-5
          ANTHROPIC_API_KEY: dummy-not-real
          USE_GITHUB_TOKEN: "true"
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          MENTIONS: /oc
