# Copy of elastic/ai-github-actions dogfood workflow, pointing at Elastic's published composite action (@v0).
name: "Repro: Claude Mention (PR)"
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: read
  pull-requests: write
jobs:
  respond:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: elastic/ai-github-actions/claude-workflows/mention-in-pr/rwxp@v0
        with:
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
