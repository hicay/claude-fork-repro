# Copy of facebookincubator/velox claude.yml core (issue_comment path), allowlist = repo owner.
name: "Repro: Velox-style Claude"
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@velox') &&
      contains(fromJSON('["hicay"]'), github.event.comment.user.login)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Claude Code
        uses: izaitsevfb/claude-code-action@ececd56fb999d06b4dd2477437bc408938295d76 # forked-pr-fix
        with:
          trigger_phrase: "@velox"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--model claude-opus-4-6 --allowedTools Skill,Read,Glob,Grep'
          settings: '{"alwaysThinkingEnabled": true}'
